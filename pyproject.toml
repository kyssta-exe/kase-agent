[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kase-agent"
version = "1.0.0"
description = "Kase Agent — The next-generation AI agent by Kyssta. Smarter, faster, more optimized."
requires-python = ">=3.11"
authors = [{ name = "Kyssta" }]
license = { text = "MIT" }
dependencies = [
  "openai>=1.0.0,<2",
  "python-dotenv>=1.0.0,<2",
  "httpx>=0.27.0,<1",
  "rich>=13.0.0,<14",
  "pyyaml>=6.0,<7",
  "requests>=2.31.0,<3",
  "jinja2>=3.1.0,<4",
  "pydantic>=2.0.0,<3",
  "prompt_toolkit>=3.0.40,<4",
  "croniter>=1.4.0,<2",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0,<1"]
dev = ["pytest>=8.0.0,<9", "pytest-asyncio>=0.23.0,<1", "ruff>=0.3.0,<1"]
messaging = ["python-telegram-bot>=20.0,<21", "aiohttp>=3.9.0,<4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
